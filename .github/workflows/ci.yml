name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, synth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local Turborepo cache: unchanged packages are restored instead of re-run.
      # Runs on main save the cache, pull requests restore it.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: CDK synth
        run: pnpm synth

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    # The three projects run side by side, so the whole suite stays well below 10 minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, iphone, pixel]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Without --with-deps: the runner image already has Chromium's system libraries, and the
      # optional font packages --with-deps adds came from a very slow apt mirror (5+ minutes).
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter e2e exec playwright install chromium

      # Against the Vite dev server with the mocked API; the `setup` project signs in first.
      - name: Playwright
        run: pnpm --filter e2e test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.project }}
          path: e2e/test-results/
          retention-days: 14
